services:
  search-api:
    build: ./api
    container_name: lan-search-api
    ports:
      - "8000:8000"
    volumes:
      - ./documents:/documents:ro
      - search-data:/data
    environment:
      # Paths
      - WATCH_FOLDER=/documents
      - DATA_FOLDER=/data
      - DATABASE_PATH=/data/sqlite/metadata.db

      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - ENRICHMENT_MODEL=${ENRICHMENT_MODEL:-}
      - SYNTHESIS_MODEL=${SYNTHESIS_MODEL:-}

      # VLM Configuration
      - VLM_PROVIDER=${VLM_PROVIDER:-ollama}
      - USE_VLM_EXTRACTION=${USE_VLM_EXTRACTION:-true}
      - VLM_FALLBACK_OCR=${VLM_FALLBACK_OCR:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3-vl:8b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120.0}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - HUGGINGFACE_VLM_MODEL=${HUGGINGFACE_VLM_MODEL:-Qwen/Qwen2.5-VL-32B-Instruct:fireworks-ai}
      - HUGGINGFACE_TIMEOUT=${HUGGINGFACE_TIMEOUT:-60.0}

      # Embedding
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-mpnet-base-v2}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}

      # Chunking
      - CHUNKING_STRATEGY=${CHUNKING_STRATEGY:-hierarchical}
      - CHUNK_SIZE=${CHUNK_SIZE:-1500}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-0}
      - MAX_CHUNK_SIZE=${MAX_CHUNK_SIZE:-2500}
      - ENABLE_SEMANTIC_CHUNKING=${ENABLE_SEMANTIC_CHUNKING:-true}
      - SEMANTIC_SIMILARITY_THRESHOLD=${SEMANTIC_SIMILARITY_THRESHOLD:-0.72}
      - ENABLE_CHUNK_LINKS=${ENABLE_CHUNK_LINKS:-true}
      - CSV_ROWS_PER_CHUNK=${CSV_ROWS_PER_CHUNK:-50}

      # Enrichment
      - ENRICHMENT_BATCH_SIZE=${ENRICHMENT_BATCH_SIZE:-5}
      - QUESTIONS_PER_CHUNK=${QUESTIONS_PER_CHUNK:-5}

      # Search
      - SEARCH_TOP_K=${SEARCH_TOP_K:-10}
      - RRF_K_CONSTANT=${RRF_K_CONSTANT:-30}
      - MULTI_VECTOR_WEIGHTS_MAIN=${MULTI_VECTOR_WEIGHTS_MAIN:-0.40}
      - MULTI_VECTOR_WEIGHTS_QUESTION=${MULTI_VECTOR_WEIGHTS_QUESTION:-0.20}
      - MULTI_VECTOR_WEIGHTS_BM25=${MULTI_VECTOR_WEIGHTS_BM25:-0.25}
      - MULTI_VECTOR_WEIGHTS_SUMMARY=${MULTI_VECTOR_WEIGHTS_SUMMARY:-0.15}

      # HyDE
      - ENABLE_HYDE=${ENABLE_HYDE:-true}
      - HYDE_ALPHA=${HYDE_ALPHA:-0.5}
      - HYDE_ADAPTIVE=${HYDE_ADAPTIVE:-true}

      # Cache
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - CACHE_SIMILARITY_THRESHOLD=${CACHE_SIMILARITY_THRESHOLD:-0.92}
      - CACHE_MAX_ENTRIES=${CACHE_MAX_ENTRIES:-2000}

      # Synthesis
      - SYNTHESIS_MAX_TOKENS=${SYNTHESIS_MAX_TOKENS:-1500}
      - SYNTHESIS_TEMPERATURE=${SYNTHESIS_TEMPERATURE:-0.1}
      - SYNTHESIS_MAX_CHUNKS=${SYNTHESIS_MAX_CHUNKS:-10}

      # Re-ranking & MMR
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - MMR_ENABLED=${MMR_ENABLED:-false}

      # Server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-ui:
    build: ./ui
    container_name: lan-search-ui
    ports:
      - "3000:3000"
    depends_on:
      search-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  search-data:
    name: lan-search-data
